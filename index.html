<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soft Calendar</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6c47ff">
<meta name="application-name" content="Soft Calendar">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calendar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
  /* ---------- Design tokens: light (default) + dark ---------- */
  :root {
    --bg:#e4e7f0; --surface:#e9ecf4; --hi:#ffffff; --lo:#b9bed2;
    --text:#22243a; --muted:#8c92ab; --accent:#6c47ff;
    --purple:#6c47ff; --green:#34c759; --blue:#3b82f6; --orange:#f59e0b; --pink:#ec4899;
    box-sizing:border-box; color-scheme:light;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#1b1d25; --surface:#232630; --hi:#303441; --lo:#13151a;
      --text:#eceefb; --muted:#7a8099; color-scheme:dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:#1b1d25; --surface:#232630; --hi:#303441; --lo:#13151a;
    --text:#eceefb; --muted:#7a8099; color-scheme:dark;
  }
  html { scroll-padding-top:env(safe-area-inset-top,0px); }
  body { background:var(--bg); color:var(--text); min-height:100vh; transition:background .3s,color .3s;
         font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; }

  /* ---------- Neumorphic helpers ---------- */
  .neu-card  { background:var(--surface); box-shadow:18px 18px 36px var(--lo),-14px -14px 30px var(--hi); transition:background .3s,box-shadow .3s; }
  .neu-raise { background:var(--surface); box-shadow:4px 4px 9px var(--lo),-4px -4px 9px var(--hi); }
  .neu-press { background:var(--surface); box-shadow:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi); }
  .neu-btn { transition:box-shadow .15s,transform .15s; cursor:pointer; color:inherit; }
  .neu-btn:active { box-shadow:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi); transform:scale(.96); }
  button:focus-visible,input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  /* ---------- Day cells ---------- */
  .day { aspect-ratio:1; width:100%; max-width:38px; margin:0 auto; border-radius:9999px; font-size:12px; font-weight:600; position:relative; display:grid; place-items:center; }
  .day.muted { color:var(--muted); opacity:.55; box-shadow:none; background:transparent; font-weight:500; }
  .day.today:not(.selected) { color:var(--accent); }
  .day.selected { background:var(--accent); color:#fff; box-shadow:0 8px 16px rgba(108,71,255,.45); }
  .dot { position:absolute; bottom:5px; width:4px; height:4px; border-radius:9999px; background:var(--accent); }
  .day.selected .dot { background:#fff; }

  /* ---------- Events ---------- */
  .event { border-left:3px solid var(--c); border-radius:4px 18px 18px 4px; animation:rise .3s ease both; }
  @keyframes rise { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
  .check { width:22px; height:22px; border-radius:9999px; display:grid; place-items:center; cursor:pointer; flex:none; color:inherit; }
  .check.done { background:var(--c); box-shadow:none; }
  .done-text { text-decoration:line-through; opacity:.5; }

  /* ---------- Modal + form ---------- */
  .field { width:100%; border-radius:16px; padding:12px 14px; font-size:14px; background:var(--surface); color:var(--text);
           box-shadow:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi); border:0; }
  .field::placeholder { color:var(--muted); }
  .swatch { width:32px; height:32px; border-radius:9999px; background:var(--c); cursor:pointer; border:0; transition:transform .15s; }
  .swatch[aria-checked="true"] { transform:scale(1.12); box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--c); }
  #modal[hidden] { display:none; }
  .sheet { animation:slide .25s ease both; }
  @keyframes slide { from{transform:translateY(30px);opacity:0} to{transform:none;opacity:1} }
</style>
</head>
<body class="flex items-center justify-center p-4">

  <main class="neu-card w-full max-w-[380px] rounded-[44px] px-5 pt-5 pb-7">

    <!-- Top bar -->
    <div class="flex items-center justify-between mb-4 px-1">
      <span class="text-xs font-semibold tracking-widest" style="color:var(--muted)">CALENDAR</span>
      <div class="flex items-center gap-3">
        <button id="todayBtn" class="neu-raise neu-btn h-9 px-4 rounded-full text-[11px] font-bold" style="color:var(--accent)">Today</button>
        <button id="theme" aria-label="Toggle theme" class="neu-raise neu-btn w-9 h-9 rounded-full grid place-items-center"></button>
      </div>
    </div>

    <!-- Header -->
    <header class="flex items-center justify-between mb-5">
      <button id="prev" aria-label="Previous month" class="neu-raise neu-btn w-10 h-10 rounded-full grid place-items-center">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="text-center">
        <h1 id="title" class="text-lg font-bold tracking-tight"></h1>
        <p id="counter" class="text-[11px]" style="color:var(--muted)"></p>
      </div>
      <button id="next" aria-label="Next month" class="neu-raise neu-btn w-10 h-10 rounded-full grid place-items-center">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </header>

    <div class="grid grid-cols-7 text-center text-[10px] font-semibold tracking-wider mb-3" style="color:var(--muted)">
      <span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span><span>SUN</span>
    </div>
    <div id="grid" class="grid grid-cols-7 gap-y-3 gap-x-1"></div>

    <!-- Events panel -->
    <section class="neu-press rounded-3xl mt-6 p-4">
      <div class="flex items-center justify-between mb-3">
        <h2 id="eventsTitle" class="text-sm font-bold"></h2>
        <button id="add" aria-label="Add event" class="neu-raise neu-btn w-8 h-8 rounded-full grid place-items-center" style="color:var(--accent)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div id="events" class="space-y-3"></div>
    </section>
  </main>

  <!-- Add / edit event modal -->
  <div id="modal" hidden class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4" style="background:rgba(10,12,20,.55)">
    <form id="form" class="sheet neu-card w-full max-w-[380px] rounded-[32px] p-6 space-y-4" autocomplete="off">
      <div class="flex items-center justify-between">
        <h3 id="formTitle" class="text-base font-bold">New event</h3>
        <span id="formDate" class="text-xs" style="color:var(--muted)"></span>
      </div>
      <input id="fTitle" class="field" placeholder="Title" maxlength="40" required>
      <input id="fDesc" class="field" placeholder="Description (optional)" maxlength="60">
      <input id="fTime" class="field" type="time" required>
      <div class="flex items-center gap-4" role="radiogroup" aria-label="Color">
        <button type="button" role="radio" class="swatch" data-color="purple" style="--c:var(--purple)" aria-label="Purple"></button>
        <button type="button" role="radio" class="swatch" data-color="green" style="--c:var(--green)" aria-label="Green"></button>
        <button type="button" role="radio" class="swatch" data-color="blue" style="--c:var(--blue)" aria-label="Blue"></button>
        <button type="button" role="radio" class="swatch" data-color="orange" style="--c:var(--orange)" aria-label="Orange"></button>
        <button type="button" role="radio" class="swatch" data-color="pink" style="--c:var(--pink)" aria-label="Pink"></button>
      </div>
      <label id="repeatRow" class="flex items-center gap-2 text-xs" style="color:var(--muted)">
        <input id="fRepeat" type="checkbox" class="accent-[#6c47ff]"> Repeat weekly for 8 weeks
      </label>
      <div class="flex gap-3 pt-1">
        <button type="button" id="cancel" class="neu-raise neu-btn flex-1 rounded-2xl py-3 text-sm font-semibold">Cancel</button>
        <button type="submit" class="neu-btn flex-1 rounded-2xl py-3 text-sm font-semibold text-white" style="background:var(--accent);box-shadow:0 8px 16px rgba(108,71,255,.4)">Save</button>
      </div>
    </form>
  </div>

<script>
/* ===================== Storage (guarded) ===================== */
const store = {
  get(k, fallback) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch { return fallback; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

/* ===================== State ===================== */
const COLORS = { purple:'var(--purple)', green:'var(--green)', blue:'var(--blue)', orange:'var(--orange)', pink:'var(--pink)' };
const today = new Date();
let viewY = today.getFullYear(), viewM = today.getMonth();
let selected = new Date(viewY, viewM, today.getDate());
let events = store.get('cal.events', {});   // { "YYYY-MM-DD": [{id,title,desc,time,color,done}] }
let color = 'purple';
let editingId = null;                        // id of the event being edited, or null when adding

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const sameDay = (a, b) => keyOf(a) === keyOf(b);
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eventsOn = d => (events[keyOf(d)] || []).slice().sort((a, b) => a.time.localeCompare(b.time));
const save = () => store.set('cal.events', events);
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ===================== Theme ===================== */
const SUN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const isDark = () => {
  const t = document.documentElement.dataset.theme;
  return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
};
const paintTheme = () => { $('theme').innerHTML = isDark() ? SUN : MOON; };   // icon = theme you switch to
$('theme').addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  store.set('cal.theme', next);
  paintTheme();
});

/* ===================== Render ===================== */
function renderGrid() {
  const offset = (new Date(viewY, viewM, 1).getDay() + 6) % 7;     // Monday first
  let html = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(viewY, viewM, 1 - offset + i);
    const inMonth = d.getMonth() === viewM;
    const cls = ['day','neu-raise','neu-btn', !inMonth && 'muted', sameDay(d, today) && 'today', sameDay(d, selected) && 'selected'].filter(Boolean).join(' ');
    html += `<button class="${cls}" data-ts="${d.getTime()}" aria-label="${d.toDateString()}">${d.getDate()}${eventsOn(d).length ? '<i class="dot"></i>' : ''}</button>`;
  }
  $('grid').innerHTML = html;
}

function renderHeader() {
  $('title').textContent = new Date(viewY, viewM, 1).toLocaleDateString('en-US', { month:'long', year:'numeric' });
  const prefix = `${viewY}-${pad(viewM + 1)}-`;
  const n = Object.entries(events).filter(([k]) => k.startsWith(prefix)).reduce((s, [, v]) => s + v.length, 0);
  $('counter').textContent = n ? `${n} event${n === 1 ? '' : 's'}` : 'No events';
}

function renderEvents() {
  $('eventsTitle').textContent = sameDay(selected, today)
    ? 'Today’s Events'
    : 'Events · ' + selected.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
  const list = eventsOn(selected);
  $('events').innerHTML = list.length ? list.map((e, i) => `
    <article class="event neu-raise flex items-center gap-3 py-3 pl-3 pr-3" style="--c:${COLORS[e.color]};animation-delay:${i * 60}ms">
      <div class="flex-1 min-w-0 cursor-pointer" data-edit="${e.id}">
        <p class="text-[13px] font-bold truncate ${e.done ? 'done-text' : ''}">${esc(e.title)}</p>
        ${e.desc ? `<p class="text-[10px] truncate" style="color:var(--muted)">${esc(e.desc)}</p>` : ''}
      </div>
      <span class="text-[11px] font-bold" style="color:var(--accent)">${e.time}</span>
      <button class="check neu-press ${e.done ? 'done' : ''}" style="--c:${COLORS[e.color]}" data-done="${e.id}" aria-label="Toggle done">
        ${e.done ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>' : ''}
      </button>
      <button class="neu-btn" data-del="${e.id}" aria-label="Delete event" style="color:var(--muted)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </article>`).join('')
    : `<p class="text-xs text-center py-4" style="color:var(--muted)">No events yet. Tap + to add one.</p>`;
}

const render = () => { renderHeader(); renderGrid(); renderEvents(); };

/* ===================== Navigation ===================== */
function shiftMonth(delta) {
  const t = new Date(viewY, viewM + delta, 1);
  viewY = t.getFullYear(); viewM = t.getMonth();
  selected = new Date(viewY, viewM, Math.min(selected.getDate(), new Date(viewY, viewM + 1, 0).getDate()));
  render();
}
$('prev').onclick = () => shiftMonth(-1);
$('next').onclick = () => shiftMonth(1);
$('todayBtn').onclick = () => {
  viewY = today.getFullYear(); viewM = today.getMonth();
  selected = new Date(viewY, viewM, today.getDate());
  render();
};
$('grid').addEventListener('click', e => {
  const b = e.target.closest('.day'); if (!b) return;
  selected = new Date(+b.dataset.ts);
  viewY = selected.getFullYear(); viewM = selected.getMonth();
  render();
});

/* ===================== Event actions ===================== */
$('events').addEventListener('click', e => {
  const k = keyOf(selected), list = events[k] || [];
  const done = e.target.closest('[data-done]'), del = e.target.closest('[data-del]'), edit = e.target.closest('[data-edit]');
  if (edit) { const ev = list.find(x => x.id === edit.dataset.edit); if (ev) openModal(ev); return; }
  if (done) { const ev = list.find(x => x.id === done.dataset.done); if (ev) ev.done = !ev.done; }
  if (del) { events[k] = list.filter(x => x.id !== del.dataset.del); if (!events[k].length) delete events[k]; }
  save(); render();
});

/* ===================== Modal (add / edit) ===================== */
function setColor(c) {
  color = c;
  document.querySelectorAll('.swatch').forEach(s => s.setAttribute('aria-checked', s.dataset.color === c));
}
function openModal(ev = null) {
  editingId = ev ? ev.id : null;
  $('form').reset();
  $('formTitle').textContent = ev ? 'Edit event' : 'New event';
  $('formDate').textContent = selected.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
  $('repeatRow').hidden = !!ev;                       // repeat only when creating
  $('fTitle').value = ev ? ev.title : '';
  $('fDesc').value = ev ? ev.desc : '';
  $('fTime').value = ev ? ev.time : (sameDay(selected, today) ? `${pad(Math.min(today.getHours() + 1, 23))}:00` : '09:00');
  setColor(ev ? ev.color : 'purple');
  $('modal').hidden = false;
  $('fTitle').focus();
}
const closeModal = () => { $('modal').hidden = true; editingId = null; };
$('add').onclick = () => openModal();
$('cancel').onclick = closeModal;
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
document.querySelectorAll('.swatch').forEach(s => s.onclick = () => setColor(s.dataset.color));

$('form').addEventListener('submit', e => {
  e.preventDefault();
  const title = $('fTitle').value.trim();
  if (!title) return;
  const data = { title, desc: $('fDesc').value.trim(), time: $('fTime').value || '09:00', color };
  const k = keyOf(selected);

  if (editingId) {
    const ev = (events[k] || []).find(x => x.id === editingId);
    if (ev) Object.assign(ev, data);
  } else {
    const copies = $('fRepeat').checked ? 8 : 1;
    for (let i = 0; i < copies; i++) {
      const dk = keyOf(new Date(selected.getFullYear(), selected.getMonth(), selected.getDate() + 7 * i));
      (events[dk] = events[dk] || []).push({ id: newId(), ...data, done: false });
    }
  }
  save(); closeModal(); render();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') return closeModal();
  if (!$('modal').hidden || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === 'ArrowLeft') shiftMonth(-1);
  if (e.key === 'ArrowRight') shiftMonth(1);
});

/* ===================== Init ===================== */
const savedTheme = store.get('cal.theme', null);
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
paintTheme();
render();

// Offline support: register the service worker (needs https or localhost)
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
